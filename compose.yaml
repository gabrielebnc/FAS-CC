services:
  strategy-runner:
    build: .
    image: upisas-strategy
    container_name: crawd-strat
    init: true
    environment:
      CROWDNAV_ENDPOINT: http://http-server:8080
    networks:
      - fas-net

  dashboard:
    profiles: [dashboard]
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: upisas-dashboard
    container_name: crawd-dashboard
    init: true
    environment:
      CROWDNAV_ENDPOINT: http://http-server:8080
    ports:
      - "8090:8090"
    networks:
      - fas-net

networks:
  fas-net:
    external: true
